version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus_pass_change_me
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexus']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: postgresql://nexus:nexus_pass_change_me@postgres:5432/nexus?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_32_chars_minimum_xxxxxxxxxxxx}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change_me_32_chars_minimum_yyyyyyy}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4000
      INSTALL_LOCKED: 'false'
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/backend/uploads
      - backups:/app/backend/backups
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_build:/usr/share/nginx/html:ro
volumes:
  postgres_data:
  redis_data:
  uploads:
  backups:
  frontend_build:
